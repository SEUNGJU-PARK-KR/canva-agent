name: Temporary run Largo market-phase safety patch

on:
  push:
    branches:
      - fix/largo-forward-history-preserve-20260901
    paths:
      - ".github/workflows/tmp-run-largo-market-phase-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/largo-forward-history-preserve-20260901
          fetch-depth: 0
      - name: Apply and validate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp/apply_largo_market_phase_fix.py
          python3 -m py_compile scripts/largo_winrate_v4.py scripts/validate_largo_winrate_v41.py
          PYTHONPATH=scripts python3 scripts/validate_largo_winrate_v41.py
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/largo_winrate_v4.py scripts/validate_largo_winrate_v41.py
          if ! git diff --cached --quiet; then
            git commit -m 'Block active Largo signals outside market windows'
            git push origin HEAD:fix/largo-forward-history-preserve-20260901
          fi
