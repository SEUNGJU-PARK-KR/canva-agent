name: Temporary bootstrap Largo closing-bet v5

on:
  push:
    branches:
      - feature/largo-close-v5-20260901
    paths:
      - ".github/workflows/tmp-bootstrap-largo-close-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore reviewed v5 payload and verify it
        shell: bash
        run: |
          set -euo pipefail
          cat research/largo-close-v5/bootstrap/part*.b64 > /tmp/largo-close-v5-payload.b64
          tr -d '\n\r ' < /tmp/largo-close-v5-payload.b64 | base64 -d > /tmp/largo-close-v5-payload.tar.xz
          echo "49df802254ebec87c3dcbe49f5022fa9477563db3e05be750be131a5604161b1  /tmp/largo-close-v5-payload.tar.xz" | sha256sum -c -
          tar -xJf /tmp/largo-close-v5-payload.tar.xz -C .

          python3 -m py_compile \
            scripts/largo_material_0906.py \
            scripts/capture_largo_material_0906.py \
            scripts/validate_largo_material_0906.py \
            research/largo-close-v5/optimize_close_bet_v5.py
          PYTHONPATH=scripts python3 scripts/validate_largo_material_0906.py
          python3 - <<'PY'
          from pathlib import Path
          import csv, json
          root = Path('research/largo-close-v5')
          summary = json.loads((root / 'v5_summary.json').read_text(encoding='utf-8'))
          selected = list(csv.DictReader((root / 'v5_selected_trades.csv').open(encoding='utf-8-sig')))
          report = (root / 'v5_report.html').read_text(encoding='utf-8')
          assert summary.get('version') == 'largo-close-v5'
          assert summary['coverage']['candidate_rows'] == 480
          assert summary['coverage']['evaluated_rows'] == 144
          assert summary['v5_daily']['trades'] == 4
          assert summary['v5_daily']['losses'] == 0
          assert len(selected) == 4
          assert '라르고 종가베팅 v5 재검증' in report
          assert '자동주문 없음' in report
          assert 'fetch(' not in report
          print({'v5': summary['v5_daily'], 'selected': len(selected)})
          PY

      - name: Commit actual sources, reports and workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research/largo-close-v5/bootstrap
          rm -f .github/workflows/tmp-bootstrap-largo-close-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Largo closing-bet v5 optimized gates"
          git push origin HEAD:feature/largo-close-v5-20260901
