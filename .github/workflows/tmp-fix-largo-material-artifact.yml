name: Temporary expand September eligible outcomes

on:
  push:
    branches:
      - fix/largo-september-validation-20260902
    paths:
      - ".github/workflows/tmp-fix-largo-material-artifact.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/largo-september-validation-20260902

      - name: Evaluate every eligible candidate before choosing the daily pick
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('research/largo-close-v5/validate_september_v5.py')
          text = path.read_text(encoding='utf-8')
          old = '''        eligible = sorted((row for row in day_rows if row.get("v5_eligible")), key=selection_key)
        for rank, row in enumerate(eligible, 1):
            row["daily_rank"] = rank
        if eligible:
            pick = eligible[0]
            pick["daily_pick"] = True
            next_date = NEXT_SESSION[signal_date]
            if dt.date.fromisoformat(next_date) <= today:
                add_outcome(pick, next_date, args.timeout)
            else:
                pick["next_date"] = next_date
                pick["outcome_status"] = "PENDING"
            selected.append(dict(pick))
        all_rows.extend(day_rows)
'''
          new = '''        eligible = sorted((row for row in day_rows if row.get("v5_eligible")), key=selection_key)
        next_date = NEXT_SESSION[signal_date]
        for rank, row in enumerate(eligible, 1):
            row["daily_rank"] = rank
            if dt.date.fromisoformat(next_date) <= today:
                add_outcome(row, next_date, args.timeout)
            else:
                row["next_date"] = next_date
                row["outcome_status"] = "PENDING"
        if eligible:
            pick = eligible[0]
            pick["daily_pick"] = True
            selected.append(dict(pick))
        all_rows.extend(day_rows)
'''
          if old not in text:
              raise SystemExit('validator block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile research/largo-close-v5/validate_september_v5.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/largo-close-v5/validate_september_v5.py
          git commit -m "Evaluate all eligible September v5 candidates"
          git push origin HEAD:fix/largo-september-validation-20260902
