name: Temporary fetch Largo legacy 09:06 backtest windows

on:
  push:
    branches:
      - analysis/largo-winrate-v4-20260901
    paths:
      - ".github/workflows/tmp-fetch-largo-legacy-0906-backtest.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact 15:18 and next-session 09:00-09:06 pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from html import unescape

          SIGNALS = {
            '2026-08-27': ['006400','010120','062040','267260','010170','000660','005930','003670','402340','000500','222800','298040','178320','009150','005380','047040','034020','012330','005935','232140','069540','049080','432470','192650'],
            '2026-08-28': ['196170','034020','294570','192820','096530','000660','005930','005935','257720','402340','006400','035420','298040','019170','041190','005380','001210','161890','002990','204620','009150','001820','030530','042510'],
            '2026-08-31': ['047050','096770','003670','000660','005930','011070','066970','402340','066570','034020','476060','009150','005935','006400','032940','387690','105560','256840','034220','004770','067290','002990','484870','028300'],
          }
          NEXT_DATE = {'2026-08-27':'2026-08-28','2026-08-28':'2026-08-31','2026-08-31':'2026-09-01'}
          HEADERS = {'User-Agent':'Mozilla/5.0','Referer':'https://finance.naver.com/'}

          def fetch_rows(code: str, stamp: str) -> tuple[list[list[str]], str | None]:
              params = urllib.parse.urlencode({'code':code,'thistime':stamp,'page':1})
              url = 'https://finance.naver.com/item/sise_time.naver?' + params
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                  text = raw.decode('euc-kr','replace')
                  rows = []
                  for tr in re.findall(r'<tr[^>]*onmouseover="mouseOver\(this\)"[^>]*>(.*?)</tr>', text, re.I | re.S):
                      cells = []
                      for td in re.findall(r'<td[^>]*>(.*?)</td>', tr, re.I | re.S):
                          clean = re.sub(r'<[^>]+>', ' ', td)
                          clean = unescape(re.sub(r'\s+', ' ', clean)).strip()
                          cells.append(clean)
                      if cells and cells[0]:
                          rows.append(cells)
                  return rows, None
              except Exception as exc:
                  return [], f'{type(exc).__name__}: {exc}'

          output = {
              'generated_at': dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).isoformat(),
              'definition': {
                  'signal': 'last trade at or before 15:18 from the first non-empty legacy minute row',
                  'outcome': 'trades from 09:00:00 through 09:05:59; 09:06 row excluded',
              },
              'dates': {},
              'errors': [],
          }
          request_count = 0
          for signal_date, codes in SIGNALS.items():
              next_date = NEXT_DATE[signal_date]
              signal_stamp = signal_date.replace('-','') + '151800'
              open_stamp = next_date.replace('-','') + '090600'
              day = {'next_date':next_date,'codes':{}}
              for code in codes:
                  signal_rows, signal_error = fetch_rows(code, signal_stamp)
                  time.sleep(0.18)
                  open_rows, open_error = fetch_rows(code, open_stamp)
                  time.sleep(0.18)
                  request_count += 2
                  day['codes'][code] = {
                      'signal_stamp':signal_stamp,
                      'signal_rows':signal_rows,
                      'signal_error':signal_error,
                      'open_stamp':open_stamp,
                      'open_rows':open_rows,
                      'open_error':open_error,
                  }
                  if signal_error or open_error:
                      output['errors'].append({'signal_date':signal_date,'code':code,'signal_error':signal_error,'open_error':open_error})
                  print(signal_date, code, len(signal_rows), len(open_rows), signal_error, open_error)
              output['dates'][signal_date] = day
          output['request_count'] = request_count
          with open('out/legacy_1518_0906.json','w',encoding='utf-8') as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          summary = {
              'generated_at':output['generated_at'],
              'signal_dates':len(SIGNALS),
              'candidate_rows':sum(len(v) for v in SIGNALS.values()),
              'request_count':request_count,
              'errors':len(output['errors']),
              'signal_pages_with_rows':sum(bool(box['signal_rows']) for day in output['dates'].values() for box in day['codes'].values()),
              'open_pages_with_rows':sum(bool(box['open_rows']) for day in output['dates'].values() for box in day['codes'].values()),
          }
          with open('out/summary.json','w',encoding='utf-8') as f:
              json.dump(summary,f,ensure_ascii=False,indent=2)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: largo-legacy-1518-0906-backtest
          path: out
          retention-days: 2
