name: Largo closing-bet v5 report rebuild

on:
  push:
    branches:
      - main
    paths:
      - "scripts/largo_material_0906.py"
      - "scripts/capture_largo_material_0906.py"
      - "scripts/validate_largo_material_0906.py"
      - "data/material-0906-bootstrap.json.gz.b64"
      - ".github/workflows/largo-target3.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/largo_material_0906.py"
      - "scripts/capture_largo_material_0906.py"
      - "scripts/validate_largo_material_0906.py"
      - ".github/workflows/largo-target3.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Largo material grade and pre-09:06 validation"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: largo-closing-v5-report
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Compile and validate v5 engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/largo_material_0906.py \
            scripts/capture_largo_material_0906.py \
            scripts/validate_largo_material_0906.py
          PYTHONPATH=scripts python3 scripts/validate_largo_material_0906.py

      - name: Recover cumulative history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target3-public target3-work
          mkdir -p target3-public/data target3-work
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded=''.join(Path('data/material-0906-bootstrap.json.gz.b64').read_text(encoding='ascii').split())
          Path('target3-work/bootstrap.json').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          curl -fsSL --max-time 20 \
            https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/material-0906-history.json \
            -o target3-work/history.json \
          || cp target3-work/bootstrap.json target3-work/history.json
          curl -fsSL --max-time 20 \
            https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/latest.json \
            -o target3-work/latest.json \
          || echo '{"candidates":[]}' > target3-work/latest.json

      - name: Rebuild v5 report without capturing a new signal
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/capture_largo_material_0906.py \
            --stage bootstrap \
            --history target3-work/history.json \
            --bootstrap target3-work/bootstrap.json \
            --latest target3-work/latest.json \
            --output-history target3-public/data/material-0906-history.json \
            --summary target3-public/data/material-0906-summary.json \
            --csv target3-public/data/material-0906-results.csv \
            --report target3-public/material-0906.html
          touch target3-public/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('target3-public')
          summary=json.loads((root/'data/material-0906-summary.json').read_text(encoding='utf-8'))
          history=json.loads((root/'data/material-0906-history.json').read_text(encoding='utf-8'))
          report=(root/'material-0906.html').read_text(encoding='utf-8')
          assert summary.get('target3_version')=='largo-close-v5'
          assert history.get('target3_version')=='largo-close-v5'
          assert '라르고 종가베팅 v5' in report
          assert '추세·거래대금형' in report
          assert 'fetch(' not in report
          print({'selected':(summary.get('target3_selected') or {}).get('n'),'version':summary.get('target3_version')})
          PY

      - name: Upload v5 report artifact
        uses: actions/upload-artifact@v4
        with:
          name: largo-closing-v5-live-report
          path: target3-public
          retention-days: 90

      - name: Publish v5 live report
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target3-public
          publish_branch: gh-pages
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Update Largo closing-bet v5 live report
