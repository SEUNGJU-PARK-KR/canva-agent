name: Temporary apply September stability patch

on:
  push:
    branches:
      - fix/largo-september-reconstruction-stability-20260902
    paths:
      - ".github/workflows/tmp-apply-september-stability.yml"
      - "research/largo-close-v5/patch_september_stability.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/largo-september-reconstruction-stability-20260902

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch, compile and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 research/largo-close-v5/patch_september_stability.py
          python3 -m py_compile research/largo-close-v5/validate_september_v5.py
          rm research/largo-close-v5/patch_september_stability.py
          rm .github/workflows/tmp-apply-september-stability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exclude unstable September reconstructions from official v5 results"
          git push origin HEAD:fix/largo-september-reconstruction-stability-20260902
