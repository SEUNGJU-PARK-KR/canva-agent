name: Largo long-history read-only audit 20260905
on:
  push:
    branches:
      - research/largo-history-audit-20260905
    paths:
      - scripts/research_largo_history_collect_20260905.py
      - .github/workflows/largo-history-audit-20260905.yml
permissions:
  contents: read
concurrency:
  group: largo-history-audit-20260905
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collection dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Validate frozen v6 engine
        run: |
          python -m py_compile scripts/research_largo_history_collect_20260905.py scripts/largo_close_v6_shadow.py
          PYTHONPATH=scripts python scripts/validate_largo_close_v6_shadow.py
      - name: Collect public historical data
        run: |
          set -euo pipefail
          mkdir -p output/largo-history-audit-20260905
          python scripts/research_largo_history_collect_20260905.py 2>&1 | tee output/largo-history-audit-20260905/collection.log
      - name: Preserve source and raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: largo-history-audit-20260905
          path: output/largo-history-audit-20260905
          retention-days: 90
