name: Temporary export Largo bundle source

on:
  push:
    branches:
      - improve/largo-early-close-20260831
    paths:
      - ".github/workflows/tmp-export-largo-source.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-source
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zipfile
          root=Path('bundles/largo_close_site_v2')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          encoded=''.join((root/name).read_text(encoding='ascii') for name in manifest['parts'])
          raw=base64.b64decode(encoded)
          assert len(raw)==manifest['size']
          assert hashlib.sha256(raw).hexdigest()==manifest['sha256']
          archive=Path('build-source')/manifest['archive']
          archive.write_bytes(raw)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              z.extractall('build-source')
          PY
          find build-source -maxdepth 3 -type f -print
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: largo-bundle-source
          path: build-source
          retention-days: 2
