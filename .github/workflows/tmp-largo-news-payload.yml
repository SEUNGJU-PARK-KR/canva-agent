name: Temporary inspect Largo news payloads

on:
  push:
    branches:
      - improve/largo-early-close-20260831
    paths:
      - ".github/workflows/tmp-largo-news-payload.yml"

permissions:
  contents: read

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch representative public news and notice payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          codes=['019170','001210','069540','009150','298040','006400','196170','003670']
          headers={'User-Agent':'Mozilla/5.0 (compatible; LargoGapResearch/1.0)','Referer':'https://stock.naver.com/','Accept':'application/json,text/plain,*/*'}
          result={}
          for code in codes:
              result[code]={}
              for kind,url in {
                  'news':f'https://stock.naver.com/api/domestic/detail/news?itemCode={code}&page=1&pageSize=20',
                  'notice':f'https://stock.naver.com/api/domestic/detail/notice?itemCode={code}&startIdx=0&pageSize=20',
              }.items():
                  req=urllib.request.Request(url,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:
                          payload=json.loads(r.read().decode('utf-8'))
                      result[code][kind]={'url':url,'payload':payload}
                  except Exception as exc:
                      result[code][kind]={'url':url,'error':repr(exc)}
                  time.sleep(.15)
          Path('output/news_notice_payloads.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print({'codes':len(codes)})
          PY
      - name: Upload payloads
        uses: actions/upload-artifact@v4
        with:
          name: largo-news-payloads
          path: output
          retention-days: 2
