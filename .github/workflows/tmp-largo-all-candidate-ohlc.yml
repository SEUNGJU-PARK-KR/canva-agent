name: Temporary Largo all-candidate OHLC

on:
  push:
    branches:
      - improve/largo-early-close-20260831
    paths:
      - ".github/workflows/tmp-largo-all-candidate-ohlc.yml"

permissions:
  contents: read

jobs:
  fetch-ohlc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch bounded public Naver chart data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import time
          import urllib.request
          from pathlib import Path

          codes = [
            "000500","000660","001210","001820","002990","003670","004770","005380","005930","005935",
            "006400","009150","010120","010170","011070","012330","019170","028300","030530","032940",
            "034020","034220","035420","041190","042510","047040","047050","049080","062040","066570",
            "066970","067290","069540","096530","096770","105560","161890","178320","192650","192820",
            "196170","204620","222800","232140","256840","257720","267260","294570","298040","387690",
            "402340","432470","476060","484870"
          ]
          out = {
            "source": "Naver Stock public read-only chart endpoint",
            "start": "20260824",
            "end": "20260904",
            "items": {},
            "errors": [],
          }
          headers = {
            "User-Agent": "Mozilla/5.0 (compatible; LargoBacktest/1.0)",
            "Referer": "https://stock.naver.com/",
            "Accept": "application/json,text/plain,*/*",
          }
          for index, code in enumerate(codes, 1):
            url = (
              f"https://api.stock.naver.com/chart/domestic/item/{code}"
              "?periodType=dayCandle&startDateTime=20260824&endDateTime=20260904"
            )
            request = urllib.request.Request(url, headers=headers)
            try:
              with urllib.request.urlopen(request, timeout=20) as response:
                payload = json.loads(response.read().decode("utf-8"))
              out["items"][code] = {"url": url, "payload": payload}
              print(index, code, len(payload.get("priceInfos") or []))
            except Exception as exc:
              out["errors"].append({"code": code, "error": repr(exc), "url": url})
              print(index, code, "ERROR", repr(exc))
            time.sleep(0.12)
          path = Path("output/naver_ohlc_all_candidates_20260824_20260904.json")
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          print({"codes": len(codes), "ok": len(out["items"]), "errors": len(out["errors"]), "path": str(path)})
          PY

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('output/naver_ohlc_all_candidates_20260824_20260904.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          assert len(data.get('items') or {}) >= 50, len(data.get('items') or {})
          usable=0
          for code,item in (data.get('items') or {}).items():
              rows=((item.get('payload') or {}).get('priceInfos') or [])
              if rows:
                  usable += 1
          assert usable >= 50, usable
          print({'items':len(data['items']),'usable':usable,'errors':len(data.get('errors') or [])})
          PY

      - name: Upload OHLC artifact
        uses: actions/upload-artifact@v4
        with:
          name: largo-all-candidate-ohlc
          path: output
          retention-days: 2
