name: Temporary probe Naver historical data

on:
  push:
    branches:
      - analysis/largo-target3-20day-backfill-20260901
    paths:
      - ".github/workflows/tmp-probe-krx-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe Naver theme membership payload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          mkdir -p out
          python3 - <<'PY'
          import json
          from pathlib import Path
          import requests

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; LargoResearch/1.0; read-only)','Referer':'https://stock.naver.com/'})
          result={}
          u='https://stock.naver.com/api/stockSecurity/rankings/v2/domestic/themes?sortType=changeRate&period=daily&size=100'
          r=s.get(u,timeout=30)
          result['themes_status']=r.status_code
          try:
              p=r.json(); result['themes_type']=type(p).__name__; result['themes_payload']=p
              rows=[]
              if isinstance(p,list): rows=p
              elif isinstance(p,dict):
                  for k in ('items','data','result','themes','content'):
                      if isinstance(p.get(k),list): rows=p[k]; break
              result['theme_rows']=len(rows)
              if rows:
                  result['theme_first']=rows[0]
                  code=str(rows[0].get('code') or rows[0].get('no') or rows[0].get('themeCode') or '')
                  result['theme_code']=code
                  if code:
                      su=f'https://stock.naver.com/api/domestic/market/theme/{code}/stocklist?marketType=ALL&orderType=priceTop&startIdx=0&pageSize=100'
                      sr=s.get(su,timeout=30)
                      result['stocklist_status']=sr.status_code
                      try: result['stocklist_payload']=sr.json()
                      except Exception: result['stocklist_text']=sr.text[:1000]
          except Exception as exc:
              result['error']=f'{type(exc).__name__}: {exc}'; result['text']=r.text[:1000]
          Path('out/probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in result.items() if k not in {'themes_payload','stocklist_payload'}},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naver-theme-probe
          path: out
          retention-days: 3
