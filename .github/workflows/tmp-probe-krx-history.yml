name: Temporary probe reverse historical minute data

on:
  push:
    branches:
      - analysis/largo-target3-20day-backfill-20260901
    paths:
      - ".github/workflows/tmp-probe-krx-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe reverse minute requests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          mkdir -p out
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          import requests

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; LargoMinuteProbe/1.0; read-only)','Referer':'https://finance.naver.com/'})
          urls={
            'json_r2_12_400':'https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=2&count=400&startTime=202608031530&timeframe=minute',
            'json_r2_14_400':'https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=2&count=400&startTime=20260803153000&timeframe=minute',
            'json_r2_12_10000':'https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=2&count=10000&startTime=202608031530&timeframe=minute',
            'fchart_r2_12_400':'https://fchart.stock.naver.com/sise.nhn?symbol=005930&requestType=2&count=400&startTime=202608031530&timeframe=minute',
            'fchart_r2_14_400':'https://fchart.stock.naver.com/sise.nhn?symbol=005930&requestType=2&count=400&startTime=20260803153000&timeframe=minute',
            'json_r2_aug24':'https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=2&count=400&startTime=202608241530&timeframe=minute',
            'json_r2_aug25':'https://api.finance.naver.com/siseJson.naver?symbol=005930&requestType=2&count=400&startTime=202608251530&timeframe=minute',
          }
          result={}
          for key,url in urls.items():
              try:
                  r=s.get(url,timeout=40)
                  text=r.content.decode('utf-8',errors='replace')
                  stamps=re.findall(r'20\d{10,12}',text)
                  result[key]={
                      'status':r.status_code,
                      'length':len(r.content),
                      'count':len(stamps),
                      'first':stamps[:5],
                      'last':stamps[-5:],
                      'head':text[:500],
                      'tail':text[-500:],
                  }
              except Exception as exc:
                  result[key]={'error':f'{type(exc).__name__}: {exc}'}
          Path('out/reverse_minute_probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:{x:v for x,v in box.items() if x not in {'head','tail'}} for k,box in result.items()},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-historical-minute-probe
          path: out
          retention-days: 3
