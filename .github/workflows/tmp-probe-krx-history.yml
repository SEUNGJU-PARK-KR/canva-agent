name: Temporary probe Yahoo Korea minute history

on:
  push:
    branches:
      - analysis/largo-target3-20day-backfill-20260901
    paths:
      - ".github/workflows/tmp-probe-krx-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe Yahoo one-minute Korean equity history
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          mkdir -p out
          python3 - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import requests

          kst=ZoneInfo('Asia/Seoul')
          def epoch(text):
              return int(dt.datetime.fromisoformat(text).replace(tzinfo=kst).timestamp())
          tests={
              'samsung_aug3':('005930.KS','2026-08-03T08:30:00','2026-08-04T10:00:00'),
              'samsung_aug31':('005930.KS','2026-08-31T08:30:00','2026-09-01T10:00:00'),
              'kosdaq_aug3':('196170.KQ','2026-08-03T08:30:00','2026-08-04T10:00:00'),
          }
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          result={}
          for key,(symbol,start,end) in tests.items():
              url=f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}'
              params={'period1':epoch(start),'period2':epoch(end),'interval':'1m','includePrePost':'false','events':'history'}
              try:
                  r=s.get(url,params=params,timeout=40)
                  box={'status':r.status_code,'length':len(r.content),'url':r.url}
                  try:
                      payload=r.json(); box['error']=payload.get('chart',{}).get('error')
                      rows=(payload.get('chart',{}).get('result') or [])
                      if rows:
                          row=rows[0]; ts=row.get('timestamp') or []
                          meta=row.get('meta') or {}
                          box['count']=len(ts); box['timezone']=meta.get('exchangeTimezoneName')
                          box['first']=[dt.datetime.fromtimestamp(x,kst).isoformat() for x in ts[:5]]
                          box['last']=[dt.datetime.fromtimestamp(x,kst).isoformat() for x in ts[-5:]]
                          quote=((row.get('indicators') or {}).get('quote') or [{}])[0]
                          box['sample']=[{name:(values[:3] if isinstance(values,list) else values) for name,values in quote.items()}]
                  except Exception as exc:
                      box['parse_error']=f'{type(exc).__name__}: {exc}'; box['text']=r.text[:1000]
                  result[key]=box
              except Exception as exc:
                  result[key]={'error':f'{type(exc).__name__}: {exc}'}
          Path('out/yahoo_minute_probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yahoo-korea-minute-probe
          path: out
          retention-days: 3
