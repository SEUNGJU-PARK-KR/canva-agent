name: Apply Largo early-watch review fixes

on:
  push:
    branches:
      - improve/largo-early-close-20260831
    paths:
      - ".github/workflows/patch-largo-early-review.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/largo-early-close-20260831
          fetch-depth: 0

      - name: Apply review fixes and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path('scripts/build_largo_close_no_hoga.py')
          text = script.read_text(encoding='utf-8')
          old = '''def is_gate_active(check_id: str, source_at: dt.datetime | None) -> bool:\n    gate_time = LATE_GATE_TIMES.get(check_id)\n    if gate_time is None:\n        return True\n    return bool(source_at and source_at.time() >= gate_time)\n'''
          new = '''def is_gate_active(check_id: str, source_at: dt.datetime | None) -> bool:\n    gate_time = LATE_GATE_TIMES.get(check_id)\n    if gate_time is None or source_at is None:\n        return True\n    return source_at.time() >= gate_time\n'''
          if old not in text and new not in text:
              raise SystemExit('is_gate_active block not found')
          if old in text:
              script.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/largo-close-early-watch.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '''          || true\n\n      - name: Refresh bounded public market snapshots\n'''
          replacement = '''          || true\n          python3 - <<'PY'\n          from pathlib import Path\n          import json\n          path=Path('build-source/site/data/history.json')\n          if not path.exists() or not path.stat().st_size:\n              raise SystemExit(0)\n          try:\n              data=json.loads(path.read_text(encoding='utf-8'))\n              if not isinstance(data, dict) or not isinstance(data.get('snapshots'), list):\n                  raise ValueError('snapshots array missing')\n          except Exception as exc:\n              print(f'Ignoring invalid history: {exc}')\n              path.unlink(missing_ok=True)\n          PY\n\n      - name: Refresh bounded public market snapshots\n'''
          if 'Ignoring invalid history' not in text:
              if marker not in text:
                  raise SystemExit('history validation marker not found')
              workflow.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          readme = Path('largo-close-screener/README.md')
          text = readme.read_text(encoding='utf-8')
          old_stage = '`조기 감시 → 우선 준비 → 진입 준비 → 마감 유지 확인 → 종가 단일가 검토 → 종가 확정 검증`'
          new_stage = '`조기 탐색 → 조기 감시 → 우선 준비 → 진입 준비 → 마감 유지 확인 → 종가 단일가 검토 → 종가 확정 검증`'
          if old_stage in text:
              readme.write_text(text.replace(old_stage, new_stage, 1), encoding='utf-8')
          elif new_stage not in text:
              raise SystemExit('README stage sequence not found')
          PY
          python3 -m py_compile scripts/build_largo_close_no_hoga.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/largo-close-early-watch.yml').read_text(encoding='utf-8'))
          print('workflow yaml ok')
          PY
          git rm .github/workflows/patch-largo-early-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_largo_close_no_hoga.py .github/workflows/largo-close-early-watch.yml largo-close-screener/README.md
          git commit -m 'Address early close-watch review findings'
          git push origin HEAD:improve/largo-early-close-20260831
