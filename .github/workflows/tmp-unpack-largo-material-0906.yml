name: Temporary unpack Largo material 09:06 sources

on:
  push:
    branches:
      - feature/largo-material-0906-v1-20260901
    paths:
      - ".github/workflows/tmp-unpack-largo-material-0906.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify, unpack and validate staged sources
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/largo-material-0906-payload/part*.b64 > /tmp/largo-material-0906.b64
          base64 -d /tmp/largo-material-0906.b64 > /tmp/largo-material-0906.zip
          echo "80158884611db0079ea0a0839d3697787f4d1bd7c1c36e5f5474a7d773a6fc94  /tmp/largo-material-0906.zip" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path('/tmp/largo-material-0906.zip')
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              z.extractall('.')
              print({'files':z.namelist()})
          PY
          python3 -m py_compile scripts/largo_material_0906.py
          python3 -m py_compile scripts/capture_largo_material_0906.py
          python3 -m py_compile scripts/validate_largo_material_0906.py
          PYTHONPATH=scripts python3 scripts/validate_largo_material_0906.py

      - name: Commit unpacked sources and remove staged chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r tmp/largo-material-0906-payload
          git add scripts/largo_material_0906.py \
                  scripts/capture_largo_material_0906.py \
                  scripts/validate_largo_material_0906.py \
                  data/material-0906-bootstrap.json.gz.b64 \
                  docs/largo-material-0906.md
          git commit -m 'Add deterministic material score and pre-09:06 validator'
          git push origin HEAD:feature/largo-material-0906-v1-20260901
