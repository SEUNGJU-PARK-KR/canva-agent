name: LargoTV full target source capture

on:
  push:
    branches:
      - largo-openmaus-browser-pilot-20260825
    paths:
      - ".github/workflows/largo-full-target-capture.yml"
      - "scripts/largo_full_target_capture.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/largo-full-target-capture.yml"
      - "scripts/largo_full_target_capture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: largo-openmaus-browser-pilot-20260825

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frame-analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow numpy opencv-python-headless
          python -m py_compile scripts/largo_full_target_capture.py
          google-chrome --version || chromium --version || true

      - name: Play the complete video and capture source frames
        run: |
          python scripts/largo_full_target_capture.py largo_full_target_output

      - name: Build manifest
        if: always()
        run: |
          find largo_full_target_output -type f -printf '%P\t%s\n' | sort > largo_full_target_output/manifest.tsv || true
          du -sh largo_full_target_output || true

      - name: Upload complete evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: largo-full-target-capture
          path: largo_full_target_output
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
