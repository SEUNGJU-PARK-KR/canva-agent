name: Largo early close-betting watchlist

on:
  push:
    branches:
      - main
      - improve/largo-early-close-20260831
    paths:
      - "scripts/build_largo_close_no_hoga.py"
      - ".github/workflows/largo-close-early-watch.yml"
      - ".github/workflows/patch-largo-early-review.yml"
      - "largo-close-screener/README.md"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/build_largo_close_no_hoga.py"
      - ".github/workflows/largo-close-early-watch.yml"
      - ".github/workflows/patch-largo-early-review.yml"
      - "largo-close-screener/README.md"
  workflow_dispatch:
  schedule:
    # KST 13:38, 13:53, 14:08, 14:23, 14:33, 14:53, 15:04, 15:23 on weekdays.
    - cron: "38,53 4 * * 1-5"
    - cron: "8,23,33,53 5 * * 1-5"
    - cron: "4,23 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: largo-close-early-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-early-watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # REVIEW_FIX_START
      - name: Apply review fixes once
        if: github.event_name == 'push' && github.ref == 'refs/heads/improve/largo-early-close-20260831'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script=Path('scripts/build_largo_close_no_hoga.py')
          text=script.read_text(encoding='utf-8')
          old='''def is_gate_active(check_id: str, source_at: dt.datetime | None) -> bool:\n    gate_time = LATE_GATE_TIMES.get(check_id)\n    if gate_time is None:\n        return True\n    return bool(source_at and source_at.time() >= gate_time)\n'''
          new='''def is_gate_active(check_id: str, source_at: dt.datetime | None) -> bool:\n    gate_time = LATE_GATE_TIMES.get(check_id)\n    if gate_time is None or source_at is None:\n        return True\n    return source_at.time() >= gate_time\n'''
          if old in text:
              script.write_text(text.replace(old,new,1),encoding='utf-8')
          elif new not in text:
              raise SystemExit('is_gate_active block not found')

          readme=Path('largo-close-screener/README.md')
          text=readme.read_text(encoding='utf-8')
          old_stage='`조기 감시 → 우선 준비 → 진입 준비 → 마감 유지 확인 → 종가 단일가 검토 → 종가 확정 검증`'
          new_stage='`조기 탐색 → 조기 감시 → 우선 준비 → 진입 준비 → 마감 유지 확인 → 종가 단일가 검토 → 종가 확정 검증`'
          if old_stage in text:
              readme.write_text(text.replace(old_stage,new_stage,1),encoding='utf-8')
          elif new_stage not in text:
              raise SystemExit('README stage sequence not found')

          workflow=Path('.github/workflows/largo-close-early-watch.yml')
          text=workflow.read_text(encoding='utf-8')
          start_marker='      # '+'REVIEW_FIX_START\n'
          end_marker='      # '+'REVIEW_FIX_END\n'
          start=text.index(start_marker)
          end=text.index(end_marker,start)+len(end_marker)
          workflow.write_text(text[:start]+text[end:],encoding='utf-8')

          temporary=Path('.github/workflows/patch-largo-early-review.yml')
          temporary.unlink(missing_ok=True)
          PY
          python3 -m py_compile scripts/build_largo_close_no_hoga.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path('.github/workflows/largo-close-early-watch.yml').read_text(encoding='utf-8'))
          print('review fixes validated')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Address early close-watch review findings'
            git push origin HEAD:improve/largo-early-close-20260831
          fi
      # REVIEW_FIX_END

      - name: Restore reviewed site bundle and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-source early-public
          mkdir -p build-source
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zipfile
          root=Path('bundles/largo_close_site_v2')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          encoded=''.join((root/name).read_text(encoding='ascii') for name in manifest['parts'])
          raw=base64.b64decode(encoded)
          assert len(raw)==manifest['size'], (len(raw), manifest['size'])
          digest=hashlib.sha256(raw).hexdigest()
          assert digest==manifest['sha256'], (digest, manifest['sha256'])
          archive=Path('build-source')/manifest['archive']
          archive.write_bytes(raw)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              z.extractall('build-source')
          print({'archive':str(archive),'size':len(raw),'sha256':digest})
          PY
          python3 -m py_compile build-source/tools/scrape_naver_close.py
          python3 -m py_compile scripts/build_largo_close_no_hoga.py

      - name: Recover the latest intraday history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-source/site/data
          curl -fsSL --max-time 20 \
            https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/history.json \
            -o build-source/site/data/history.json \
          || curl -fsSL --max-time 20 \
            https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/main/largo-close-screener/site/data/history.json \
            -o build-source/site/data/history.json \
          || true
          python3 - <<'PY'
          from pathlib import Path
          import json
          path=Path('build-source/site/data/history.json')
          if not path.exists() or not path.stat().st_size:
              raise SystemExit(0)
          try:
              data=json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(data, dict) or not isinstance(data.get('snapshots'), list):
                  raise ValueError('snapshots array missing')
          except Exception as exc:
              print(f'Ignoring invalid history: {exc}')
              path.unlink(missing_ok=True)
          PY

      - name: Refresh bounded public market snapshots
        shell: bash
        run: |
          set -euo pipefail
          history_args=()
          if [ -s build-source/site/data/history.json ]; then
            history_args=(--history build-source/site/data/history.json)
          fi
          python3 build-source/tools/scrape_naver_close.py \
            --output build-source/site/data/latest.json \
            --history-out build-source/site/data/history.json \
            "${history_args[@]}" \
            --max-candidates 24 \
            --rank-size 80 \
            --theme-size 25 \
            --delay 0.15 \
            --timeout 20

      - name: Build phase-aware no-orderbook watchlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p early-public/data
          history_args=()
          if [ -s build-source/site/data/history.json ]; then
            history_args=(--history build-source/site/data/history.json)
          fi
          python3 scripts/build_largo_close_no_hoga.py \
            --latest build-source/site/data/latest.json \
            --methodology build-source/site/data/methodology.json \
            "${history_args[@]}" \
            --output early-public/no-hoga.html
          cp build-source/site/data/latest.json early-public/data/latest-early.json
          cp build-source/site/data/history.json early-public/data/history.json
          touch early-public/.nojekyll

      - name: Validate early watchlist output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('early-public')
          html=(root/'no-hoga.html').read_text(encoding='utf-8')
          latest=json.loads((root/'data/latest-early.json').read_text(encoding='utf-8'))
          history=json.loads((root/'data/history.json').read_text(encoding='utf-8'))
          assert '라르고 종가베팅 조기 후보' in html
          assert '지금 준비할 상위 후보' in html
          assert '마감 조건은 삭제하지 않고' in html
          assert '호가 판정 미사용' in html
          assert '주문·계좌 기능은 없습니다' in html
          assert 'fetch(' not in html
          assert 'http://' not in html and 'https://' not in html
          assert len(html.encode('utf-8')) > 25000
          assert isinstance(latest.get('candidates'), list)
          assert isinstance(history.get('snapshots'), list)
          print({
            'html_bytes':len(html.encode('utf-8')),
            'candidates':len(latest['candidates']),
            'history_snapshots':len(history['snapshots']),
            'generated_at':latest.get('generated_at'),
          })
          PY

      - name: Upload early watchlist artifact
        uses: actions/upload-artifact@v4
        with:
          name: largo-early-close-watchlist
          path: early-public
          retention-days: 7

      - name: Publish only the early watchlist into gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./early-public
          publish_branch: gh-pages
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Refresh Largo early close-betting watchlist
