name: Largo early close-betting watchlist

on:
  push:
    branches:
      - main
      - improve/largo-winrate-v4-1-20260901
    paths:
      - "scripts/largo_winrate_v4.py"
      - "scripts/enrich_largo_winrate_v4.py"
      - "scripts/build_largo_close_no_hoga.py"
      - "scripts/validate_largo_winrate_v41.py"
      - ".github/workflows/largo-close-early-watch.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/largo_winrate_v4.py"
      - "scripts/enrich_largo_winrate_v4.py"
      - "scripts/build_largo_close_no_hoga.py"
      - "scripts/validate_largo_winrate_v41.py"
      - ".github/workflows/largo-close-early-watch.yml"
  workflow_dispatch:
  schedule:
    # KST 13:38, 13:53, 14:08, 14:23, 14:33, 14:53, 15:04, 15:18, 15:23.
    - cron: "38,53 4 * * 1-5"
    - cron: "8,23,33,53 5 * * 1-5"
    - cron: "4,18,23 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: largo-close-early-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-early-watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore reviewed site bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-source early-public
          mkdir -p build-source
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,zipfile
          root=Path('bundles/largo_close_site_v2')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          raw=base64.b64decode(''.join((root/name).read_text(encoding='ascii') for name in manifest['parts']))
          assert len(raw)==manifest['size'] and hashlib.sha256(raw).hexdigest()==manifest['sha256']
          archive=Path('build-source')/manifest['archive'];archive.write_bytes(raw)
          with zipfile.ZipFile(archive) as z: z.extractall('build-source')
          PY
          python3 -m py_compile build-source/tools/scrape_naver_close.py
          python3 -m py_compile scripts/largo_winrate_v4.py
          python3 -m py_compile scripts/enrich_largo_winrate_v4.py
          python3 -m py_compile scripts/build_largo_close_no_hoga.py
          python3 -m py_compile scripts/validate_largo_winrate_v41.py
          PYTHONPATH=scripts python3 scripts/validate_largo_winrate_v41.py

      - name: Recover histories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-source/site/data
          curl -fsSL --max-time 20 https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/history.json -o build-source/site/data/history.json || true
          curl -fsSL --max-time 20 https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/winrate-v4-history.json -o build-source/site/data/winrate-v4-history.json || true
          curl -fsSL --max-time 20 https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/winrate-v4-forward.json -o build-source/site/data/winrate-v4-forward.json || true
          python3 - <<'PY'
          from pathlib import Path
          import json
          for name,key in [('history.json','snapshots'),('winrate-v4-history.json','snapshots'),('winrate-v4-forward.json','observations')]:
              p=Path('build-source/site/data')/name
              if not p.exists(): continue
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
                  if not isinstance(d,dict) or not isinstance(d.get(key),list): raise ValueError(key)
              except Exception: p.unlink(missing_ok=True)
          PY

      - name: Refresh bounded public market snapshots
        shell: bash
        run: |
          set -euo pipefail
          history_args=()
          if [ -s build-source/site/data/history.json ]; then history_args=(--history build-source/site/data/history.json); fi
          python3 build-source/tools/scrape_naver_close.py \
            --output build-source/site/data/latest.json \
            --history-out build-source/site/data/history.json \
            "${history_args[@]}" \
            --max-candidates 24 --rank-size 80 --theme-size 25 --delay 0.15 --timeout 20

      - name: Enrich and build phase-aware v4.1 page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p early-public/data
          PYTHONPATH=scripts python3 scripts/enrich_largo_winrate_v4.py --data build-source/site/data/latest.json --timeout 15 --delay 0.08
          history_args=()
          if [ -s build-source/site/data/winrate-v4-history.json ]; then history_args=(--history build-source/site/data/winrate-v4-history.json); fi
          PYTHONPATH=scripts python3 scripts/build_largo_close_no_hoga.py \
            --latest build-source/site/data/latest.json \
            --methodology build-source/site/data/methodology.json \
            "${history_args[@]}" \
            --output early-public/no-hoga.html \
            --json-out early-public/data/winrate-v4.json \
            --history-out early-public/data/winrate-v4-history.json \
            --signals-out early-public/data/winrate-v4-signals.json
          cp build-source/site/data/latest.json early-public/data/latest-early.json
          cp build-source/site/data/history.json early-public/data/history.json
          if [ -s build-source/site/data/winrate-v4-forward.json ]; then cp build-source/site/data/winrate-v4-forward.json early-public/data/; fi
          touch early-public/.nojekyll

      - name: Validate early v4.1 output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('early-public')
          html=(root/'no-hoga.html').read_text(encoding='utf-8')
          v4=json.loads((root/'data/winrate-v4.json').read_text(encoding='utf-8'))
          assert '라르고 종가베팅' in html and '승률 개선 v4.1' in html
          assert '호가 판정 미사용' in html and '주문·계좌 기능은 없습니다' in html
          assert 'fetch(' not in html and 'http://' not in html and 'https://' not in html
          assert len(html.encode('utf-8'))>18000
          assert v4.get('version')=='largo-winrate-v4.1'
          print({'counts':v4['counts'],'bytes':len(html.encode('utf-8'))})
          PY

      - name: Upload early watchlist artifact
        uses: actions/upload-artifact@v4
        with:
          name: largo-early-winrate-v4-1
          path: early-public
          retention-days: 7

      - name: Publish early page into gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./early-public
          publish_branch: gh-pages
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Refresh Largo early win-rate v4.1 watchlist
