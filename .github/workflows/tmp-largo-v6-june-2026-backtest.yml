name: Temporary Largo v6 June 2026 backtest

on:
  push:
    branches:
      - research/largo-v6-june-2026-backtest
    paths:
      - ".github/workflows/tmp-largo-v6-june-2026-backtest.yml"
      - "research/largo-close-v6-shadow/backfill_june_v6.py"
      - "research/largo-close-v6-shadow/export_june_candidate_outcomes.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: largo-v6-june-2026-backtest
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Compile fixed v6 gate and backtest scripts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/largo_material_0906.py \
            scripts/largo_close_v6_shadow.py \
            research/largo-target3-20day/source/backfill_largo_target3_20day.py \
            research/largo-close-v6-shadow/backfill_june_v6.py \
            research/largo-close-v6-shadow/export_june_candidate_outcomes.py
          PYTHONPATH=scripts python - <<'PY'
          import largo_close_v6_shadow as v6
          assert v6.VERSION == "largo-close-v6-shadow-v1", v6.VERSION
          print({"version": v6.VERSION, "target_pct": v6.TARGET_PCT})
          PY

      - name: Reconstruct historical candidates and quote windows
        run: |
          set -euo pipefail
          rm -rf june-v6
          mkdir -p june-v6/raw june-v6/output
          PYTHONPATH=scripts python research/largo-target3-20day/source/backfill_largo_target3_20day.py \
            --output-dir june-v6/raw \
            --end-date 2026-06-30 \
            --days 25 \
            --preselect 80 \
            --workers 24 \
            2>&1 | tee june-v6/output/backfill.log

      - name: Normalize reconstructed fields for the unchanged v6 gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('june-v6/raw/target3_20day_detail.json')
          rows = json.loads(path.read_text(encoding='utf-8'))
          injected = 0
          for item in rows:
              if not isinstance(item, dict):
                  continue
              candidate = item.get('candidate') if isinstance(item.get('candidate'), dict) else {}
              metrics = candidate.get('metrics') if isinstance(candidate.get('metrics'), dict) else {}
              score = item.get('score') if isinstance(item.get('score'), dict) else {}
              structure = score.get('structure') if isinstance(score.get('structure'), dict) else {}
              if structure.get('change_rate') is None and metrics.get('change_rate') is not None:
                  structure['change_rate'] = metrics.get('change_rate')
                  score['structure'] = structure
                  item['score'] = score
                  injected += 1
          path.write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          assert injected > 0, injected
          print({'change_rate_injected': injected})
          PY

      - name: Export daily OHLC outcomes for every June candidate
        run: |
          set -euo pipefail
          python research/largo-close-v6-shadow/export_june_candidate_outcomes.py \
            --detail june-v6/raw/target3_20day_detail.json \
            --output june-v6/output/june-candidate-outcomes.csv \
            --month 2026-06 \
            --workers 18 \
            2>&1 | tee june-v6/output/outcome-export.log

      - name: Apply unchanged v6 shadow gate and build daily table
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python research/largo-close-v6-shadow/backfill_june_v6.py \
            --detail june-v6/raw/target3_20day_detail.json \
            --output-dir june-v6/output \
            --month 2026-06 \
            2>&1 | tee june-v6/output/postprocess.log

      - name: Validate retained result files
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('june-v6/output')
          summary = json.loads((root/'june-v6-summary.json').read_text(encoding='utf-8'))
          daily = list(csv.DictReader((root/'june-v6-daily.csv').open(encoding='utf-8-sig')))
          selected = list(csv.DictReader((root/'june-v6-selected.csv').open(encoding='utf-8-sig')))
          all_outcomes = list(csv.DictReader((root/'june-candidate-outcomes.csv').open(encoding='utf-8-sig')))
          all_summary = json.loads((root/'june-candidate-outcomes.summary.json').read_text(encoding='utf-8'))
          assert summary['rule_version'] == 'largo-close-v6-shadow-v1-unchanged'
          assert summary['month'] == '2026-06'
          assert 20 <= summary['signal_days'] <= 22, summary['signal_days']
          assert len(daily) == summary['signal_days']
          assert len(selected) == summary['proxy_selected_days']
          assert summary['candidate_rows'] >= summary['signal_days'] * 20
          assert len(all_outcomes) == summary['candidate_rows']
          assert all_summary['known_outcomes'] == len(all_outcomes)
          assert all(row['signal_date'].startswith('2026-06') for row in daily)
          print({
            'signal_days': summary['signal_days'],
            'candidate_rows': summary['candidate_rows'],
            'all_outcomes': len(all_outcomes),
            'exact_entry_quote_rows': summary['exact_entry_quote_rows'],
            'official_selected_days': summary['official_selected_days'],
            'proxy_selected_days': summary['proxy_selected_days'],
            'proxy_hit3_full_day_count': summary['proxy_hit3_full_day_count'],
          })
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: largo-v6-june-2026-backtest
          path: june-v6
          retention-days: 90
