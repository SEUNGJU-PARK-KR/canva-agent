name: Quick Naver closing auction field check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quick-auction-field-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture auction fields
        run: |
          set -euo pipefail
          mkdir -p tools/auction-field-check
          python3 - <<'PY'
          import datetime as dt,json,re,time,urllib.request
          from pathlib import Path
          from zoneinfo import ZoneInfo
          KST=ZoneInfo('Asia/Seoul');code='005930';ua='Mozilla/5.0 Chrome/138 Safari/537.36';ref=f'https://stock.naver.com/domestic/stock/{code}/price'
          urls={
            'price':f'https://stock.naver.com/api/domestic/detail/{code}/price',
            'hoga':f'https://stock.naver.com/api/domestic/detail/{code}/hoga',
            'poll':f'https://stock.naver.com/api/polling/domestic/stock?itemCodes={code}',
            'mobile':f'https://m.stock.naver.com/api/stock/{code}/basic',
          }
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json,text/plain,*/*','Referer':ref})
            with urllib.request.urlopen(req,timeout=12) as r:return json.loads(r.read().decode('utf-8',errors='replace'))
          snaps=[]
          for i in range(3):
            data={name:get(url) for name,url in urls.items()}
            snaps.append({'captured_at':dt.datetime.now(KST).isoformat(),'data':data})
            if i<2:time.sleep(8)
          pattern=re.compile(r'(expect|estimated|predict|auction|closing|single|indicative|match|예상|체결|동시호가|단일가)',re.I)
          def walk(v,p='root'):
            if isinstance(v,dict):
              for k,x in v.items():
                q=f'{p}.{k}';yield q,x;yield from walk(x,q)
            elif isinstance(v,list):
              for i,x in enumerate(v[:50]):q=f'{p}[{i}]';yield q,x;yield from walk(x,q)
          matches=[]
          for si,s in enumerate(snaps):
            for name,payload in s['data'].items():
              for path,val in walk(payload):
                if pattern.search(path.rsplit('.',1)[-1]):matches.append({'snapshot':si,'endpoint':name,'path':path,'value':val if not isinstance(val,(dict,list)) else f'<{type(val).__name__}:{len(val)}>'})
          compact={'generated_at':dt.datetime.now(KST).isoformat(),'snapshots':[],'matching_fields':matches}
          for s in snaps:
            row={'captured_at':s['captured_at'],'endpoints':{}}
            for name,p in s['data'].items():
              if name=='hoga':row['endpoints'][name]={k:p.get(k) for k in ['nowPrice','bestSellHoga','bestBuyHoga','totalSellVolume','totalBuyVolume','hoga1','hoga2','hoga10']}
              elif name=='price':row['endpoints'][name]={k:p.get(k) for k in ['marketStatus','nowPrice','askBuy','askSell','tradeVolume','tradeAmount']}
              elif name=='poll':
                d=(p.get('datas') or [{}])[0];row['endpoints'][name]={'pollingInterval':p.get('pollingInterval'),'time':p.get('time'),'data':{k:d.get(k) for k in ['marketStatus','closePrice','localTradedAt','accumulatedTradingVolumeRaw','accumulatedTradingValueRaw','overMarketPriceInfo','integratedPriceInfo']}}
              else:row['endpoints'][name]={k:p.get(k) for k in ['marketStatus','closePrice','localTradedAt','delayTime','delayTimeName','overMarketPriceInfo']}
            compact['snapshots'].append(row)
          path=Path('tools/auction-field-check/latest.json');path.write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8');print(path.stat().st_size)
          PY
      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/auction-field-check/latest.json
          git commit -m 'Record Naver closing auction field check'
          git push origin HEAD:main
