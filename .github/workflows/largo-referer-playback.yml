name: LargoTV referer-backed playback check

on:
  push:
    branches:
      - largo-referer-playback-pilot-20260825
    paths:
      - ".github/workflows/largo-referer-playback.yml"
      - "scripts/largo_referer_playback.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/largo-referer-playback.yml"
      - "scripts/largo_referer_playback.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: largo-referer-playback-pilot-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m py_compile scripts/largo_referer_playback.py
          google-chrome --version || chromium --version || true
      - name: Check playback inside a normal referring page
        run: python scripts/largo_referer_playback.py largo_referer_playback_output
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: largo-referer-playback
          path: largo_referer_playback_output
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
