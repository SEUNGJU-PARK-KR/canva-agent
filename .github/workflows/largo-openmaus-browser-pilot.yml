name: LargoTV OpenMaus browser playback pilot

on:
  push:
    branches:
      - largo-openmaus-browser-pilot-20260825
    paths:
      - ".github/workflows/largo-openmaus-browser-pilot.yml"
      - "scripts/largo_openmaus_playback_pilot.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/largo-openmaus-browser-pilot.yml"
      - "scripts/largo_openmaus_playback_pilot.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: largo-openmaus-browser-pilot-20260825

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m py_compile scripts/largo_openmaus_playback_pilot.py
          google-chrome --version || chromium --version || true

      - name: Verify genuine YouTube playback and capture frames
        run: |
          python scripts/largo_openmaus_playback_pilot.py largo_openmaus_playback_output

      - name: Build artifact manifest
        if: always()
        run: |
          find largo_openmaus_playback_output -type f -printf '%P\t%s\n' | sort > largo_openmaus_playback_output/manifest.tsv || true
          du -sh largo_openmaus_playback_output || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: largo-openmaus-browser-pilot
          path: largo_openmaus_playback_output
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
