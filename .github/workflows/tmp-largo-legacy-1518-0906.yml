name: Temporary Largo 15:18 and pre-09:06 backfill

on:
  push:
    branches:
      - feature/largo-material-0906-v1-20260901
    paths:
      - ".github/workflows/tmp-largo-legacy-1518-0906.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch bounded Naver legacy time pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PYCODE'
          import datetime as dt
          import html as html_lib
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          DATES = {"2026-08-27": ["006400", "010120", "062040", "267260", "010170", "000660", "005930", "003670", "402340", "000500", "222800", "298040", "178320", "009150", "005380", "047040", "034020", "012330", "005935", "232140", "069540", "049080", "432470", "192650"], "2026-08-28": ["196170", "034020", "294570", "192820", "096530", "000660", "005930", "005935", "257720", "402340", "006400", "035420", "298040", "019170", "041190", "005380", "001210", "161890", "002990", "204620", "009150", "001820", "030530", "042510"], "2026-08-31": ["096770", "003670", "000660", "005930", "017670", "011070", "006400", "402340", "005380", "012450", "066570", "034020", "476060", "066970", "009150", "005935", "032940", "196170", "387690", "256840", "067290", "004770", "002990", "161890"]}
          NEXT = {"2026-08-27":"2026-08-28","2026-08-28":"2026-08-31","2026-08-31":"2026-09-01"}
          BASE = "https://finance.naver.com/item/sise_time.naver"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; LargoMaterial0906/1.0; read-only)",
              "Referer": "https://finance.naver.com/",
              "Accept": "text/html,application/xhtml+xml",
          }

          def fetch(code: str, stamp: str) -> tuple[bytes | None, str | None]:
              query = urllib.parse.urlencode({"code": code, "thistime": stamp, "page": 1})
              request = urllib.request.Request(BASE + "?" + query, headers=HEADERS)
              last = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.read(), None
                  except Exception as exc:
                      last = f"{type(exc).__name__}: {exc}"
                      time.sleep(0.8 * (attempt + 1))
              return None, last

          def parse_rows(raw: bytes | None) -> list[list[str]]:
              if not raw:
                  return []
              text = raw.decode("euc-kr", errors="replace")
              rows = []
              for block in re.findall(r"<tr[^>]*>(.*?)</tr>", text, flags=re.I | re.S):
                  time_match = re.search(r"(?:gray03[^>]*>|>)\s*(\d{2}:\d{2})\s*</span>", block, flags=re.I | re.S)
                  if not time_match:
                      continue
                  values = [html_lib.unescape(re.sub(r"<[^>]+>", "", value)).strip() for value in re.findall(r'<span[^>]*class="[^"]*tah p11[^"]*"[^>]*>(.*?)</span>', block, flags=re.I | re.S)]
                  values = [re.sub(r"\s+", " ", value) for value in values]
                  rows.append([time_match.group(1), *values])
              return rows

          result = {"version":"largo-legacy-1518-0906-v1","generated_at":dt.datetime.now(dt.timezone.utc).isoformat(),"dates":{},"errors":[]}
          for signal_date, codes in DATES.items():
              next_date = NEXT[signal_date]
              signal_stamp = signal_date.replace("-", "") + "151800"
              open_stamp = next_date.replace("-", "") + "090600"
              day = {"next_date":next_date,"codes":{}}
              for index, code in enumerate(codes, start=1):
                  signal_raw, signal_error = fetch(code, signal_stamp)
                  time.sleep(0.12)
                  open_raw, open_error = fetch(code, open_stamp)
                  time.sleep(0.12)
                  signal_rows = parse_rows(signal_raw)
                  open_rows = parse_rows(open_raw)
                  day["codes"][code] = {
                      "signal_rows": signal_rows,
                      "open_rows": open_rows,
                      "signal_error": signal_error,
                      "open_error": open_error,
                  }
                  if signal_error or open_error:
                      result["errors"].append({"date":signal_date,"code":code,"signal":signal_error,"open":open_error})
                  print(signal_date, index, code, len(signal_rows), len(open_rows), signal_error, open_error)
              result["dates"][signal_date] = day
          Path("out/legacy_1518_0906.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          summary = {
              "dates": list(result["dates"]),
              "codes": sum(len(day["codes"]) for day in result["dates"].values()),
              "errors": len(result["errors"]),
          }
          Path("out/summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(summary)
          PYCODE

      - name: Upload backfill artifact
        uses: actions/upload-artifact@v4
        with:
          name: largo-legacy-1518-0906-v1
          path: out
          retention-days: 3
