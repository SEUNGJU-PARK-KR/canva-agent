name: Largo one-file raw state check

on:
  push:
    branches: [research/largo-single-html-cors-20260907]
    paths: [.github/workflows/largo-single-html-raw-check.yml]

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test file-origin raw GitHub state read
        run: |
          cat > /tmp/page.html <<'HTML'
          <!doctype html><meta charset="utf-8"><script>
          window.done=false; window.result={};
          fetch('https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/manual-1515/state.json?t='+Date.now(),{cache:'no-store',mode:'cors'})
            .then(async r=>{const v=await r.json();window.result={ok:r.ok,status:r.status,version:v.version,journal:v.auto_journal?.version,days:Array.isArray(v.days)?v.days.length:null};})
            .catch(e=>window.result={ok:false,error:String(e)})
            .finally(()=>window.done=true);
          </script>
          HTML
          cat > /tmp/check.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch()
                  page=await b.new_page()
                  await page.goto('file:///tmp/page.html')
                  await page.wait_for_function('window.done===true',timeout=20000)
                  res=await page.evaluate('window.result')
                  print(json.dumps(res,ensure_ascii=False))
                  assert res.get('ok') is True, res
                  assert res.get('version')=='largo-manual-1515-v1', res
                  assert res.get('journal')=='largo-auto-journal-v1', res
                  await b.close()
          asyncio.run(main())
          PY
          python /tmp/check.py
