name: Largo closing-bet v5 historical report

on:
  push:
    branches:
      - main
    paths:
      - "research/largo-close-v5/**"
      - ".github/workflows/largo-close-v5-report.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/largo-close-v5/**"
      - ".github/workflows/largo-close-v5-report.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: largo-close-v5-historical-report
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate retained v5 analysis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, json
          root=Path('research/largo-close-v5')
          summary=json.loads((root/'v5_summary.json').read_text(encoding='utf-8'))
          report=(root/'v5_report.html').read_text(encoding='utf-8')
          selected=list(csv.DictReader((root/'v5_selected_trades.csv').open(encoding='utf-8-sig')))
          assert summary.get('version')=='largo-close-v5'
          assert (summary.get('v5_daily') or {}).get('trades')==4
          assert len(selected)==4
          assert '라르고 종가베팅 v5 재검증' in report
          assert '자동주문 없음' in report
          assert 'fetch(' not in report
          print({'trades':len(selected),'mean':summary['v5_daily']['mean_policy_return_pct']})
          PY

      - name: Build public bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf close-v5-public
          mkdir -p close-v5-public/data
          cp research/largo-close-v5/v5_report.html close-v5-public/close-v5.html
          cp research/largo-close-v5/v5_summary.json close-v5-public/data/largo-close-v5-summary.json
          cp research/largo-close-v5/v5_selected_trades.csv close-v5-public/data/largo-close-v5-selected.csv
          cp research/largo-close-v5/v5_sensitivity.csv close-v5-public/data/largo-close-v5-sensitivity.csv
          cp research/largo-close-v5/v5_condition_effects.csv close-v5-public/data/largo-close-v5-condition-effects.csv
          cp research/largo-close-v5/v5_friction_scenarios.csv close-v5-public/data/largo-close-v5-friction.csv
          touch close-v5-public/.nojekyll

      - name: Upload retained v5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: largo-close-v5-historical-report
          path: close-v5-public
          retention-days: 90

      - name: Publish retained v5 report
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./close-v5-public
          publish_branch: gh-pages
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Publish Largo closing-bet v5 historical report
