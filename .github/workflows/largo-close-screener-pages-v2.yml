name: Build and publish Largo closing screener v3.2

on:
  push:
    branches:
      - largo-close-screener-site-20260826
    paths:
      - "scripts/build_largo_close_screener_v2.py"
      - "scripts/build_largo_close_screener_v3.py"
      - "scripts/build_largo_close_screener_v3_1.py"
      - "scripts/build_largo_close_screener_v3_2.py"
      - "largo-close-screener/evidence/**"
      - "largo-close-screener/data/seed_candidates_v3.json"
      - ".github/workflows/largo-close-screener-pages-v2.yml"
  workflow_dispatch:
  schedule:
    # KST 14:35, 15:00, 15:10, 15:18, 15:28 on weekdays.
    # Scheduled workflows require this file to be merged into the default branch.
    - cron: "35 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "10 6 * * 1-5"
    - cron: "18 6 * * 1-5"
    - cron: "28 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: largo-close-screener-static
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: largo-close-screener-site-20260826
          fetch-depth: 0

      - name: Validate Python sources
        run: |
          python -m py_compile \
            scripts/build_largo_close_screener_v2.py \
            scripts/build_largo_close_screener_v3.py \
            scripts/build_largo_close_screener_v3_1.py \
            scripts/build_largo_close_screener_v3_2.py

      - name: Build the pattern-aware Naver snapshot site
        run: |
          python scripts/build_largo_close_screener_v3_2.py \
            --output site-output \
            --history largo-close-screener/data/history.json \
            --candidate-limit 20

      - name: Validate generated site and decision contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('site-output')
          assert (root / 'index.html').exists()
          assert (root / 'data.json').exists()
          payload = json.loads((root / 'data.json').read_text())
          assert payload['meta']['candidate_count'] >= 1
          assert payload['meta']['mode'] != 'DEMO_FALLBACK'
          assert payload['results']
          allowed = {'READY', 'WATCH', 'EXCLUDE'}
          allowed_patterns = {
              'CLASSIC_WICK_BREAKOUT',
              'STRUCTURAL_BREAKOUT_SPLIT',
              'ACCUMULATION_WICK_WATCH',
              'LIMIT_UP_NEXT_DAY_REVIEW',
              'AFTER_CLOSE_REVIEW',
          }
          assert all(row['state'] in allowed for row in payload['results'])
          assert all(row['pattern'] in allowed_patterns for row in payload['results'])
          assert all('checks' in row and 'entry_plan' in row for row in payload['results'])
          assert all('wick_role' in row['checks'] for row in payload['results'])
          assert all(row.get('code') and row.get('name') for row in payload['results'])
          html = (root / 'index.html').read_text()
          for phrase in [
              '종가 진입 교육 5편',
              '윗꼬리는 무조건 악재가 아닙니다',
              '25,192',
              '고전형 윗꼬리 장대양봉',
              '긴 윗꼬리 매집 관찰형',
          ]:
              assert phrase in html, phrase
          print(json.dumps(payload['meta'], ensure_ascii=False, indent=2))
          print(json.dumps({
              'patterns': {p: sum(r['pattern'] == p for r in payload['results']) for p in sorted(allowed_patterns)},
              'states': {s: sum(r['state'] == s for r in payload['results']) for s in sorted(allowed)},
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish generated files to the working branch
        run: |
          rm -rf largo-close-screener/site
          mkdir -p largo-close-screener/site
          cp -a site-output/. largo-close-screener/site/
          cat > largo-close-screener/site/PUBLIC_URL.txt <<'EOF'
          Stable development URL:
          https://raw.githack.com/SEUNGJU-PARK-KR/canva-agent/largo-close-screener-site-20260826/largo-close-screener/site/index.html

          GitHub HTML preview fallback:
          https://htmlpreview.github.io/?https://github.com/SEUNGJU-PARK-KR/canva-agent/blob/largo-close-screener-site-20260826/largo-close-screener/site/index.html
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add largo-close-screener/data/history.json largo-close-screener/site
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Publish Largo closing screener v3.2 snapshot [skip ci]"
            git push origin HEAD:largo-close-screener-site-20260826
          fi

      - name: Upload reproducibility package
        uses: actions/upload-artifact@v4
        with:
          name: largo-close-screener-v3-2-site
          path: |
            site-output
            largo-close-screener/evidence
            largo-close-screener/data/history.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
