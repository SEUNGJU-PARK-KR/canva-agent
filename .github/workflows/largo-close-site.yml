name: Largo closing screener public site

on:
  push:
    branches:
      - main
      - largo-close-screener-site-20260826
    paths:
      - "bundles/largo_close_site_v2/**"
      - "scripts/augment_largo_close_site.py"
      - "scripts/fix_largo_automation_356.py"
      - ".github/workflows/largo-close-site.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bundles/largo_close_site_v2/**"
      - "scripts/augment_largo_close_site.py"
      - "scripts/fix_largo_automation_356.py"
      - ".github/workflows/largo-close-site.yml"
  schedule:
    # KST 14:40, 15:00, 15:10, 15:18, 15:28, 15:35 on weekdays.
    - cron: "40 5 * * 1-5"
    - cron: "0,10,18,28,35 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: largo-close-static-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the reviewed v2 site bundle and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-source public
          mkdir -p build-source
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zipfile
          root=Path('bundles/largo_close_site_v2')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          encoded=''.join((root/name).read_text(encoding='ascii') for name in manifest['parts'])
          raw=base64.b64decode(encoded)
          assert len(raw)==manifest['size'], (len(raw), manifest['size'])
          digest=hashlib.sha256(raw).hexdigest()
          assert digest==manifest['sha256'], (digest, manifest['sha256'])
          archive=Path('build-source')/manifest['archive']
          archive.write_bytes(raw)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              z.extractall('build-source')
          print({'archive':str(archive),'size':len(raw),'sha256':digest})
          PY
          python3 -m py_compile build-source/tools/scrape_naver_close.py
          python3 -m py_compile scripts/augment_largo_close_site.py
          python3 -m py_compile scripts/fix_largo_automation_356.py

      - name: Recover prior static history when available
        shell: bash
        run: |
          mkdir -p build-source/site/data
          curl -fsSL --max-time 20 \
            https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/main/largo-close-screener/site/data/history.json \
            -o build-source/site/data/history.json || true

      - name: Refresh bounded Naver Stock read-only snapshots
        shell: bash
        run: |
          set -euo pipefail
          history_args=()
          if [ -s build-source/site/data/history.json ]; then
            history_args=(--history build-source/site/data/history.json)
          fi
          python3 build-source/tools/scrape_naver_close.py \
            --output build-source/site/data/latest.json \
            --history-out build-source/site/data/history.json \
            "${history_args[@]}" \
            --max-candidates 24 \
            --rank-size 80 \
            --theme-size 25 \
            --delay 0.25 \
            --timeout 25

      - name: Automate repeated best bid, entry stop and next-day plans
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/augment_largo_close_site.py \
            --data build-source/site/data/latest.json \
            --site build-source/site/index.html \
            --audit build-source/site/data/automation-356.json \
            --max-candidates 8 \
            --rounds 3 \
            --interval 7
          python3 scripts/fix_largo_automation_356.py \
            --data build-source/site/data/latest.json \
            --site build-source/site/index.html \
            --audit build-source/site/data/automation-356.json

      - name: Validate strict Largo screening and automation output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('build-source/site')
          data=json.loads((root/'data/latest.json').read_text(encoding='utf-8'))
          audit=json.loads((root/'data/automation-356.json').read_text(encoding='utf-8'))
          assert data.get('schema_version')==2
          assert data.get('strategy_version')
          assert isinstance(data.get('candidates'), list)
          allowed={'EXCLUDE','WATCH','CLOSE_READY','NEXT_DAY_HOGA_CONFIRM'}
          assert all(x.get('final_status') in allowed for x in data['candidates'])
          auto=data.get('automation_356') or {}
          assert auto.get('version') == 'automation-356-v2'
          assert auto.get('automated_steps') == [3,5,6]
          assert audit.get('status') == 'PASS'
          for candidate in data['candidates']:
              assert candidate.get('checks')
              assert candidate.get('plan')
              assert candidate.get('pattern')
              assert candidate.get('catalyst')
              automation=candidate.get('automation_356')
              assert automation
              assert automation.get('best_bid')
              assert automation.get('risk_plan')
              assert automation.get('next_day_plan')
          eligible=[x for x in data['candidates'] if x.get('final_status') in {'WATCH','CLOSE_READY','NEXT_DAY_HOGA_CONFIRM'}]
          planned=[x for x in eligible if (x.get('automation_356') or {}).get('risk_plan',{}).get('entry_price')]
          assert planned or not eligible
          site=(root/'index.html').read_text(encoding='utf-8')
          assert 'LARGO_AUTOMATION_356_START' in site
          assert '자동화된 최종 확인 3·5·6' in site
          assert "status!=='NOT_ELIGIBLE'" in site
          assert len(site.encode('utf-8')) > 15000
          assert (root/'analysis.html').stat().st_size > 3000
          assert (root/'data/methodology.json').stat().st_size > 5000
          print({
            'candidates':len(data['candidates']),
            'counts':data.get('counts'),
            'automation_counts':auto.get('counts'),
            'eligible_render_count':audit.get('eligible_render_count'),
            'source_errors':len(data.get('source',{}).get('errors',[])),
          })
          PY

      - name: Prepare public directory
        run: |
          cp -a build-source/site public
          touch public/.nojekyll

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: largo-close-screener-site-automation-356-v2
          path: public
          retention-days: 14

      # Deploy this run's verified artifact directly. A commit pushed with
      # GITHUB_TOKEN does not recursively start the fallback Pages workflow.
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish generated static site into the repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf largo-close-screener/site
          mkdir -p largo-close-screener/site
          cp -a public/. largo-close-screener/site/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add largo-close-screener/site
          if git diff --cached --quiet; then
            echo 'Static site already current.'
            exit 0
          fi
          git commit -m 'Refresh Largo closing screener static site'
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
