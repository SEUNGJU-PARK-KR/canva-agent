name: Largo closing screener public site

on:
  push:
    branches:
      - main
      - improve/largo-winrate-v4-1-20260901
    paths:
      - "bundles/largo_close_site_v2/**"
      - "scripts/augment_largo_close_site.py"
      - "scripts/fix_largo_automation_356.py"
      - "scripts/largo_winrate_v4.py"
      - "scripts/enrich_largo_winrate_v4.py"
      - "scripts/build_largo_close_no_hoga.py"
      - "scripts/validate_largo_winrate_v41.py"
      - "scripts/capture_largo_forward_v4.py"
      - ".github/workflows/largo-close-site.yml"
      - ".github/workflows/largo-close-early-watch.yml"
      - ".github/workflows/largo-winrate-forward-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bundles/largo_close_site_v2/**"
      - "scripts/augment_largo_close_site.py"
      - "scripts/fix_largo_automation_356.py"
      - "scripts/largo_winrate_v4.py"
      - "scripts/enrich_largo_winrate_v4.py"
      - "scripts/build_largo_close_no_hoga.py"
      - "scripts/validate_largo_winrate_v41.py"
      - "scripts/capture_largo_forward_v4.py"
      - ".github/workflows/largo-close-site.yml"
      - ".github/workflows/largo-close-early-watch.yml"
      - ".github/workflows/largo-winrate-forward-test.yml"
  schedule:
    # KST 14:40, 15:00, 15:10, 15:18, 15:23, 15:28, 15:35 on weekdays.
    - cron: "40 5 * * 1-5"
    - cron: "0,10,18,23,28,35 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: largo-close-static-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore reviewed site bundle and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-source public
          mkdir -p build-source
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zipfile
          root=Path('bundles/largo_close_site_v2')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          encoded=''.join((root/name).read_text(encoding='ascii') for name in manifest['parts'])
          raw=base64.b64decode(encoded)
          assert len(raw)==manifest['size']
          assert hashlib.sha256(raw).hexdigest()==manifest['sha256']
          archive=Path('build-source')/manifest['archive']
          archive.write_bytes(raw)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              z.extractall('build-source')
          PY
          python3 -m py_compile build-source/tools/scrape_naver_close.py
          python3 -m py_compile scripts/augment_largo_close_site.py
          python3 -m py_compile scripts/fix_largo_automation_356.py
          python3 -m py_compile scripts/largo_winrate_v4.py
          python3 -m py_compile scripts/enrich_largo_winrate_v4.py
          python3 -m py_compile scripts/build_largo_close_no_hoga.py
          python3 -m py_compile scripts/validate_largo_winrate_v41.py
          PYTHONPATH=scripts python3 scripts/validate_largo_winrate_v41.py
          python3 -m py_compile scripts/capture_largo_forward_v4.py

      - name: Recover prior histories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-source/site/data
          recover() {
            local remote="$1" local_path="$2"
            curl -fsSL --max-time 20 "$remote" -o "$local_path" || rm -f "$local_path"
          }
          recover https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/history.json build-source/site/data/history.json
          recover https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/winrate-v4-history.json build-source/site/data/winrate-v4-history.json
          recover https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/winrate-v4-forward.json build-source/site/data/winrate-v4-forward.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          for name, key in [('history.json','snapshots'),('winrate-v4-history.json','snapshots'),('winrate-v4-forward.json','observations')]:
              path=Path('build-source/site/data')/name
              if not path.exists():
                  continue
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
                  if not isinstance(data,dict) or not isinstance(data.get(key),list):
                      raise ValueError(f'{key} missing')
              except Exception as exc:
                  print(f'Ignoring invalid {name}: {exc}')
                  path.unlink(missing_ok=True)
          forward=Path('build-source/site/data/winrate-v4-forward.json')
          if not forward.exists():
              forward.write_text(json.dumps({
                  'version':'largo-winrate-v4.1',
                  'updated_at':None,
                  'latest_stage':None,
                  'signal_at':'',
                  'observations':[],
                  'latest':[],
                  'notes':[
                      '일봉·현재가 관찰 기록이며 자동 주문을 수행하지 않습니다.',
                      '목표와 구조선이 모두 관측된 날은 분봉 순서를 확인하기 전까지 결과를 확정하지 않습니다.',
                      '종가 보유형은 +1% 50%, +2% 30%, 잔여 20% 추적을 전진 검증합니다.',
                      '익일 확인형은 09:05·09:15 전일 종가 회복 유지와 갭 +3% 미만을 요구합니다.'
                  ]
              }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Refresh bounded public market snapshots
        shell: bash
        run: |
          set -euo pipefail
          history_args=()
          if [ -s build-source/site/data/history.json ]; then
            history_args=(--history build-source/site/data/history.json)
          fi
          python3 build-source/tools/scrape_naver_close.py \
            --output build-source/site/data/latest.json \
            --history-out build-source/site/data/history.json \
            "${history_args[@]}" \
            --max-candidates 24 \
            --rank-size 80 \
            --theme-size 25 \
            --delay 0.25 \
            --timeout 25

      - name: Automate entry, stop and next-day plans
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/augment_largo_close_site.py \
            --data build-source/site/data/latest.json \
            --site build-source/site/index.html \
            --audit build-source/site/data/automation-356.json \
            --max-candidates 8 \
            --rounds 3 \
            --interval 7
          python3 scripts/fix_largo_automation_356.py \
            --data build-source/site/data/latest.json \
            --site build-source/site/index.html \
            --audit build-source/site/data/automation-356.json

      - name: Enrich catalyst timing and repair deterministic gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/enrich_largo_winrate_v4.py \
            --data build-source/site/data/latest.json \
            --timeout 15 \
            --delay 0.10

      - name: Build win-rate v4.1 page and signal data
        shell: bash
        run: |
          set -euo pipefail
          history_args=()
          if [ -s build-source/site/data/winrate-v4-history.json ]; then
            history_args=(--history build-source/site/data/winrate-v4-history.json)
          fi
          PYTHONPATH=scripts python3 scripts/build_largo_close_no_hoga.py \
            --latest build-source/site/data/latest.json \
            --methodology build-source/site/data/methodology.json \
            "${history_args[@]}" \
            --output build-source/site/no-hoga.html \
            --json-out build-source/site/data/winrate-v4.json \
            --history-out build-source/site/data/winrate-v4-history.json \
            --signals-out build-source/site/data/winrate-v4-signals.json

      - name: Validate site and v4.1 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('build-source/site')
          data=json.loads((root/'data/latest.json').read_text(encoding='utf-8'))
          v4=json.loads((root/'data/winrate-v4.json').read_text(encoding='utf-8'))
          signals=json.loads((root/'data/winrate-v4-signals.json').read_text(encoding='utf-8'))
          html=(root/'no-hoga.html').read_text(encoding='utf-8')
          assert isinstance(data.get('candidates'),list)
          assert v4.get('version')=='largo-winrate-v4.1'
          assert isinstance(v4.get('candidates'),list)
          assert isinstance(signals.get('candidates'),list)
          assert '라르고 종가베팅' in html
          assert '승률 개선 v4.1' in html
          assert '호가 조건 제외' in html
          assert '호가 판정 미사용' in html
          assert '기준 확인:' in html
          assert '주문·계좌 기능은 없습니다' in html
          assert 'fetch(' not in html
          assert 'http://' not in html and 'https://' not in html
          assert len(html.encode('utf-8')) > 18000
          for row in v4['candidates']:
              if row['lane']=='CLOSE_ENTRY':
                  assert row['close_fit'] is True
                  assert row['risk']['status']=='PASS'
                  assert not row['hard_failures'] and not row['hard_unresolved']
                  assert row['close_variant'] in {'CORE','ELITE'}
                  if row['close_variant']=='CORE':
                      assert row['features']['rank'] <= 3
                      assert row['features']['digest_ratio'] >= 0.45
                  else:
                      assert row['features']['rank'] <= 2
                      assert row['features']['digest_ratio'] >= 0.30
                      assert row['features']['theme_breadth'] >= 0.75
                      assert row['features']['close_location'] >= 0.95
                      assert row['features']['upper_wick'] <= 0.05
              if row['lane']=='NEXT_DAY_CONFIRM':
                  assert row['confirm_fit'] is True
                  assert row['risk']['status']=='PASS'
          print({'counts':v4['counts'],'html_bytes':len(html.encode('utf-8')),'signals':len(signals['candidates'])})
          PY

      - name: Prepare public directory
        run: |
          cp -a build-source/site public
          touch public/.nojekyll

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: largo-close-screener-winrate-v4-1
          path: public
          retention-days: 14

      - name: Publish generated static site into repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf largo-close-screener/site
          mkdir -p largo-close-screener/site
          cp -a public/. largo-close-screener/site/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add largo-close-screener/site
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh Largo win-rate v4.1 static site'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish verified site to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Refresh Largo win-rate v4.1 GitHub Pages
