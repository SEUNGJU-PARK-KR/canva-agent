name: Temporary Largo v5 July 2026 validation

on:
  push:
    branches:
      - research/largo-v5-july-2026-validation
    paths:
      - "research/largo-close-v5/run_july_v5_canonical.py"
      - ".github/workflows/tmp-largo-v5-july-2026-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: largo-v5-july-2026-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Compile canonical engine and July runner
        run: |
          python -m py_compile scripts/largo_material_0906.py
          python -m py_compile research/largo-close-v5/run_july_v5_canonical.py

      - name: Run fixed v5 over July 2026
        run: |
          python research/largo-close-v5/run_july_v5_canonical.py \
            --output-dir july-v5 \
            --workers 24 \
            --timeout 25 \
            2>&1 | tee july-v5-run.log

      - name: Validate retained tables
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path("july-v5/output")
          summary = json.loads((root / "july-v5-summary.json").read_text(encoding="utf-8"))
          daily = list(csv.DictReader((root / "july-v5-daily.csv").open(encoding="utf-8-sig")))
          assert summary["version"] == "largo-close-v5-july-2026-canonical-v1"
          assert summary["rule_version"] == "largo-close-v5"
          assert summary["signal_days"] == 22
          assert summary["candidate_rows"] == 528
          assert len(daily) == 22
          print(summary)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: largo-v5-july-2026-canonical
          path: |
            july-v5
            july-v5-run.log
          retention-days: 90
