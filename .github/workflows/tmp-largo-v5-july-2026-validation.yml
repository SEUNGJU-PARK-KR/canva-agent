name: Temporary Largo v5 July 2026 validation

on:
  push:
    branches:
      - research/largo-v5-july-2026-validation
    paths:
      - ".github/workflows/tmp-largo-v5-july-2026-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: largo-v5-july-2026-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Compile canonical v5 engine and historical runner
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/largo_material_0906.py \
            research/largo-target3-20day/source/backfill_largo_target3_20day.py
          PYTHONPATH=scripts python - <<'PY'
          import largo_material_0906 as m
          assert m.TARGET3_VERSION == "largo-close-v5", m.TARGET3_VERSION
          print({"target3_version": m.TARGET3_VERSION, "target_pct": m.TARGET3_PCT})
          PY

      - name: Reconstruct all July trading days
        run: |
          set -euo pipefail
          rm -rf july-v5
          mkdir -p july-v5/raw july-v5/output
          PYTHONPATH=scripts python research/largo-target3-20day/source/backfill_largo_target3_20day.py \
            --output-dir july-v5/raw \
            --end-date 2026-07-31 \
            --days 23 \
            --preselect 80 \
            --workers 24 \
            2>&1 | tee july-v5/output/run.log

      - name: Build date-by-date v5 result table
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import csv, json, math, statistics
          from collections import defaultdict
          from pathlib import Path

          root = Path('july-v5')
          source = root / 'raw/target3_20day_rows.csv'
          with source.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))

          def num(value):
              try:
                  x = float(value)
                  return x if math.isfinite(x) else None
              except (TypeError, ValueError):
                  return None

          def truth(value):
              return str(value).strip().lower() in {'true','1','yes'}

          grouped = defaultdict(list)
          for row in rows:
              grouped[row['signal_date']].append(row)

          daily = []
          selected = []
          for date in sorted(grouped):
              day = grouped[date]
              eligible = [r for r in day if truth(r.get('target3_eligible'))]
              eligible.sort(key=lambda r: (
                  num(r.get('risk_rate')) if num(r.get('risk_rate')) is not None else math.inf,
                  num(r.get('spread_pct')) if num(r.get('spread_pct')) is not None else math.inf,
                  -(num(r.get('trade_value')) or 0.0),
                  r.get('code') or '',
              ))
              item = {
                  'signal_date': date,
                  'candidate_count': len(day),
                  'eligible_count': len(eligible),
                  'trade_action': 'NO_TRADE',
                  'code': '', 'name': '', 'lane': '',
                  'entry_ask': '', 'entry_bid': '', 'spread_pct': '',
                  'risk_rate': '', 'next_date': day[0].get('next_date','') if day else '',
                  'max_executable_return_pct': '',
                  'last_executable_return_pct': '',
                  'policy_return_pct': '',
                  'hit_3_exec': '',
                  'outcome_status': 'NO_ELIGIBLE',
                  'evidence_title': '',
              }
              if eligible:
                  pick = eligible[0]
                  max_ret = num(pick.get('max_executable_return_pct'))
                  last_ret = num(pick.get('last_executable_return_pct'))
                  policy = 3.0 if max_ret is not None and max_ret >= 3.0 else last_ret
                  outcome = 'EVALUATED' if max_ret is not None and last_ret is not None else 'NO_0906_QUOTE'
                  item.update({
                      'trade_action': 'BUY_PROXY',
                      'code': (pick.get('code') or '').zfill(6),
                      'name': pick.get('name') or '',
                      'lane': pick.get('target3_lane') or '',
                      'entry_ask': pick.get('entry_ask') or '',
                      'entry_bid': pick.get('entry_bid') or '',
                      'spread_pct': pick.get('spread_pct') or '',
                      'risk_rate': pick.get('risk_rate') or '',
                      'next_date': pick.get('next_date') or '',
                      'max_executable_return_pct': '' if max_ret is None else round(max_ret, 4),
                      'last_executable_return_pct': '' if last_ret is None else round(last_ret, 4),
                      'policy_return_pct': '' if policy is None else round(policy, 4),
                      'hit_3_exec': '' if max_ret is None else max_ret >= 3.0,
                      'outcome_status': outcome,
                      'evidence_title': pick.get('evidence_title') or '',
                  })
                  selected.append(dict(item))
              daily.append(item)

          fields = list(daily[0]) if daily else []
          with (root/'output/july-v5-daily.csv').open('w', encoding='utf-8-sig', newline='') as f:
              w=csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(daily)
          with (root/'output/july-v5-selected.csv').open('w', encoding='utf-8-sig', newline='') as f:
              w=csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(selected)

          evaluated = [r for r in selected if r['outcome_status']=='EVALUATED']
          returns = [num(r['policy_return_pct']) for r in evaluated]
          returns = [x for x in returns if x is not None]
          summary = {
              'version': 'largo-close-v5-july-2026-backfill-v1',
              'rule_version': 'largo-close-v5-unchanged',
              'signal_days': len(daily),
              'candidate_rows': len(rows),
              'eligible_rows': sum(int(r['eligible_count']) for r in daily),
              'selected_days': len(selected),
              'no_trade_days': sum(r['trade_action']=='NO_TRADE' for r in daily),
              'evaluated_picks': len(evaluated),
              'no_outcome_quote_picks': sum(r['outcome_status']=='NO_0906_QUOTE' for r in selected),
              'positive_picks': sum((num(r['policy_return_pct']) or 0) > 0 for r in evaluated),
              'loss_picks': sum((num(r['policy_return_pct']) or 0) < 0 for r in evaluated),
              'hit3_picks': sum(truth(r['hit_3_exec']) for r in evaluated),
              'mean_policy_return_pct': round(statistics.fmean(returns),4) if returns else None,
              'median_policy_return_pct': round(statistics.median(returns),4) if returns else None,
              'sum_policy_return_pct': round(sum(returns),4) if returns else None,
              'dates': [r['signal_date'] for r in daily],
              'selected': selected,
              'limitations': [
                  '후보군은 과거 일봉과 현재 상장·테마 목록으로 재구성했습니다.',
                  '시가총액은 현재 주식 수를 과거 종가에 곱한 대용치입니다.',
                  '테마 구성은 현재 목록을 과거 날짜에 대입한 값입니다.',
                  '정확한 15:18 매도호가와 다음 날 09:00~09:05 매수호가가 없으면 성과를 확정하지 않았습니다.',
                  '수수료, 세금, 호가 잔량과 주문 지연은 반영하지 않았습니다.',
              ],
          }
          (root/'output/july-v5-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Validate and retain results
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('july-v5/output')
          summary=json.loads((root/'july-v5-summary.json').read_text(encoding='utf-8'))
          daily=list(csv.DictReader((root/'july-v5-daily.csv').open(encoding='utf-8-sig')))
          selected=list(csv.DictReader((root/'july-v5-selected.csv').open(encoding='utf-8-sig')))
          assert summary['rule_version']=='largo-close-v5-unchanged'
          assert summary['signal_days']==23
          assert len(daily)==23
          assert len(selected)==summary['selected_days']
          assert summary['candidate_rows'] > 0
          print({k:summary[k] for k in ('signal_days','candidate_rows','eligible_rows','selected_days','evaluated_picks','hit3_picks')})
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: largo-v5-july-2026-validation
          path: july-v5
          retention-days: 90
