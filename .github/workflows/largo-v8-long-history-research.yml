name: Largo v8 long historical reconstruction
on:
  push:
    branches: [research/largo-3stock-gsquant-20260904]
    paths:
      - '.github/workflows/largo-v8-long-history-research.yml'
      - 'research/largo-3stock-gsquant/collect_v8_long_history.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: largo-v8-long-history-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GS Quant and numerical dependencies
        run: python -m pip install gs-quant==2.1.12 pandas numpy requests beautifulsoup4
      - name: Reconstruct fixed-v8 historical inputs and prior correlations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p long-history/qc
          python -m pip freeze > long-history/qc/requirements-lock.txt
          git rev-parse HEAD > long-history/qc/source-commit.txt
          python research/largo-3stock-gsquant/collect_v8_long_history.py 2>&1 | tee long-history/qc/run.log
      - name: Archive complete and partial research data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: largo-v8-long-history-2022-2026
          path: long-history
          retention-days: 90
          if-no-files-found: error
