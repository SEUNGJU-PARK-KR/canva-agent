name: Largo material grade and pre-09:06 validation

on:
  push:
    branches:
      - main
    paths:
      - "scripts/largo_material_0906.py"
      - "scripts/capture_largo_material_0906.py"
      - "scripts/validate_largo_material_0906.py"
      - "data/material-0906-bootstrap.json.gz.b64"
      - ".github/workflows/largo-material-0906.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/largo_material_0906.py"
      - "scripts/capture_largo_material_0906.py"
      - "scripts/validate_largo_material_0906.py"
      - "data/material-0906-bootstrap.json.gz.b64"
      - ".github/workflows/largo-material-0906.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Capture stage"
        required: true
        default: "bootstrap"
        type: choice
        options:
          - bootstrap
          - "14:53"
          - "15:10"
          - "15:18"
          - "09:06"
  schedule:
    # KST 14:53, 15:10, 15:18 and next-session 09:06 on weekdays.
    - cron: "53 5 * * 1-5"
    - cron: "10 6 * * 1-5"
    - cron: "18 6 * * 1-5"
    - cron: "6 0 * * 1-5"

permissions:
  contents: write

concurrency:
  group: largo-material-0906
  cancel-in-progress: false

jobs:
  capture-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Choose deterministic stage
        id: stage
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          stage="bootstrap"
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              "53 5 * * 1-5") stage="14:53" ;;
              "10 6 * * 1-5") stage="15:10" ;;
              "18 6 * * 1-5") stage="15:18" ;;
              "6 0 * * 1-5") stage="09:06" ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            stage="${MANUAL_STAGE:-bootstrap}"
          elif [ "$EVENT_NAME" = "push" ]; then
            hm="$(TZ=Asia/Seoul date +%H%M)"
            if [ "$hm" -ge 1445 ] && [ "$hm" -le 1504 ]; then
              stage="14:53"
            elif [ "$hm" -ge 1505 ] && [ "$hm" -le 1515 ]; then
              stage="15:10"
            elif [ "$hm" -ge 1516 ] && [ "$hm" -le 1530 ]; then
              stage="15:18"
            fi
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "Selected stage: $stage"

      - name: Compile and validate rule engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/largo_material_0906.py \
            scripts/capture_largo_material_0906.py \
            scripts/validate_largo_material_0906.py
          PYTHONPATH=scripts python3 scripts/validate_largo_material_0906.py

      - name: Recover history and decode historical seed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf material-public material-work
          mkdir -p material-public/data material-work
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded=''.join(Path('data/material-0906-bootstrap.json.gz.b64').read_text(encoding='ascii').split())
          Path('material-work/bootstrap.json').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          curl -fsSL --max-time 20 \
            https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/material-0906-history.json \
            -o material-work/history.json \
          || cp material-work/bootstrap.json material-work/history.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          for name in ('bootstrap.json','history.json'):
              path=Path('material-work')/name
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
                  assert isinstance(data,dict)
                  assert isinstance(data.get('signals',[]),list)
                  assert isinstance(data.get('results',[]),list)
              except Exception as exc:
                  if name=='history.json':
                      print(f'History invalid, restoring seed: {exc}')
                      path.write_bytes((Path('material-work')/'bootstrap.json').read_bytes())
                  else:
                      raise
          PY

      - name: Recover latest candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 \
            https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/gh-pages/data/latest.json \
            -o material-work/latest.json \
          || curl -fsSL --max-time 20 \
            https://raw.githubusercontent.com/SEUNGJU-PARK-KR/canva-agent/main/largo-close-screener/site/data/latest.json \
            -o material-work/latest.json \
          || echo '{"candidates":[]}' > material-work/latest.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          path=Path('material-work/latest.json')
          try:
              data=json.loads(path.read_text(encoding='utf-8'))
              assert isinstance(data,dict)
              assert isinstance(data.get('candidates',[]),list)
          except Exception as exc:
              print(f'Latest snapshot invalid: {exc}')
              path.write_text('{"candidates":[]}',encoding='utf-8')
          PY

      - name: Capture stage and rebuild report
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/capture_largo_material_0906.py \
            --stage "${{ steps.stage.outputs.stage }}" \
            --history material-work/history.json \
            --bootstrap material-work/bootstrap.json \
            --latest material-work/latest.json \
            --output-history material-public/data/material-0906-history.json \
            --summary material-public/data/material-0906-summary.json \
            --csv material-public/data/material-0906-results.csv \
            --report material-public/material-0906.html \
            --timeout 20 \
            --delay 0.12
          touch material-public/.nojekyll

      - name: Validate generated research artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('material-public')
          history=json.loads((root/'data/material-0906-history.json').read_text(encoding='utf-8'))
          summary=json.loads((root/'data/material-0906-summary.json').read_text(encoding='utf-8'))
          report=(root/'material-0906.html').read_text(encoding='utf-8')
          assert history.get('version')=='largo-material-0906-v1'
          assert summary.get('version')=='largo-material-0906-v1'
          assert summary.get('target3_version')=='largo-close-v5'
          assert isinstance(history.get('theme_snapshots'),list)
          assert isinstance(history.get('signals'),list)
          assert isinstance(history.get('results'),list)
          assert summary.get('evaluated_rows',0) >= 72
          assert '라르고 종가베팅 v5' in report
          assert '생성형 AI 미사용' in report
          assert '자동주문 없음' in report
          assert 'fetch(' not in report
          assert 'http://' not in report and 'https://' not in report
          assert len(report.encode('utf-8')) > 9000
          print({
              'stage':'${{ steps.stage.outputs.stage }}',
              'signals':len(history['signals']),
              'results':len(history['results']),
              'evaluated_dates':summary.get('evaluated_dates'),
              'pending':summary.get('pending_signal_dates'),
              'correlation':summary.get('correlation'),
          })
          PY

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: largo-material-0906-${{ steps.stage.outputs.stage }}
          path: material-public
          retention-days: 90

      - name: Publish report and cumulative history
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./material-public
          publish_branch: gh-pages
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Update Largo material grade and pre-09:06 validation
