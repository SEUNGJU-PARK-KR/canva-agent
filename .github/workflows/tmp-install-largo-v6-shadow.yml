name: Temporary install Largo v6 shadow payload

on:
  push:
    branches:
      - feat/largo-close-v6-shadow-20260902
    paths:
      - ".github/workflows/tmp-install-largo-v6-shadow.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/largo-close-v6-shadow-20260902

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack, validate and commit v6 files
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq research/largo-close-v6/payload.zip -d .
          rm research/largo-close-v6/payload.zip
          python -m py_compile \
            scripts/largo_close_v6.py \
            scripts/build_largo_close_v6_shadow.py \
            scripts/validate_largo_close_v6.py
          PYTHONPATH=scripts python scripts/validate_largo_close_v6.py --unit-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            LARGO_V6_START_HERE.md \
            docs/largo-v6-profit-filter-report.md \
            scripts/largo_close_v6.py \
            scripts/build_largo_close_v6_shadow.py \
            scripts/validate_largo_close_v6.py \
            research/largo-close-v6
          git commit -m "Add Largo closing-bet v6 shadow research"
          git push origin HEAD:feat/largo-close-v6-shadow-20260902
